# Minimal Rambla daemon + web UI deployment.
#
# Open http://localhost:6767 after `docker compose up -d`.
# For any network-reachable deployment, change RAMBLA_PASSWORD first.
services:
  rambla:
    image: ghcr.io/getrambla/rambla:latest
    container_name: rambla
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      RAMBLA_PASSWORD: "change-me"
      # Add DNS names you use to reach this container. IPs and localhost are
      # already allowed by default.
      # RAMBLA_HOSTNAMES: "rambla.example.com,.lan"
    volumes:
      # Persistent daemon state and agent credentials/config.
      - ./rambla-home:/home/rambla
      # Code visible to Rambla and the agents it launches.
      - ./workspace:/workspace
