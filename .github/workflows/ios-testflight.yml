name: iOS TestFlight

# Manual only. A tag trigger is deliberately absent: upstream's EAS workflows
# still fire on `v*`, and two pipelines uploading the same CFBundleVersion means
# one fails. Add the tag trigger back once EAS is retired.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.8.0-beta.1). Defaults to the current ref."
        required: false
        type: string
      upload_to_testflight:
        description: "Upload the built .ipa to TestFlight"
        required: false
        default: true
        type: boolean
      submit_for_review:
        description: "Submit the uploaded build for App Store review"
        required: false
        default: false
        type: boolean
      clean_build:
        description: "Regenerate ios/ from scratch and ignore the Xcode build cache"
        required: false
        default: false
        type: boolean

concurrency:
  group: ios-testflight-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  build:
    # macos-15 ships Xcode 16.4 / iOS 18.5 SDK; App Store Connect rejects
    # uploads not built with the iOS 26 SDK or later.
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: packages/app
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      app_build_version: ${{ steps.version.outputs.app_build_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # setup-node's cache only holds the downloaded tarballs; npm ci still
      # re-extracts every one of them. No restore-keys: a partial match would
      # install dependencies that do not match the lockfile.
      - name: Cache node_modules
        id: node_modules
        if: ${{ !inputs.clean_build }}
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install JS dependencies
        if: ${{ steps.node_modules.outputs.cache-hit != 'true' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/npm-retry.mjs ci

      # EAS ran this as eas-build-post-install; GitHub Actions does not.
      - name: Build app dependencies
        run: npm --prefix ../.. run build:app-deps && npm run build:terminal-webview

      - name: Resolve native version
        id: version
        run: |
          set -euo pipefail
          node -e '
            const { getNativeReleaseVersion } = require("./native-release-version");
            const derived = getNativeReleaseVersion(require("./package.json").version);
            console.log(`app_version=${derived.appVersion}`);
            console.log(`app_build_version=${derived.iosBuildNumber}.${process.env.GITHUB_RUN_NUMBER}`);
          ' > "$RUNNER_TEMP/ios-version.env"
          cat "$RUNNER_TEMP/ios-version.env"
          cat "$RUNNER_TEMP/ios-version.env" >> "$GITHUB_OUTPUT"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: packages/app
          bundler-cache: true

      - name: Authorize the match repo over SSH
        env:
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_GIT_PRIVATE_KEY" > ~/.ssh/match_ed25519
          chmod 600 ~/.ssh/match_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/match_ed25519
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Decode the App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_KEY_P8_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/asc.p8"
          chmod 600 "$RUNNER_TEMP/asc.p8"
          echo "ASC_KEY_P8=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"

      # app.config.js omits Firebase entirely when this file is absent, so the
      # build still works without the secret.
      - name: Decode the Firebase config
        env:
          GOOGLE_SERVICE_INFO_PLIST_PROD_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_PROD_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICE_INFO_PLIST_PROD_BASE64:-}" ]; then
            echo "GOOGLE_SERVICE_INFO_PLIST_PROD_BASE64 is unset; building without Firebase."
            exit 0
          fi
          mkdir -p .secrets
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_PROD_BASE64" | openssl base64 -d -A > .secrets/GoogleService-Info.prod.plist

      - name: Generate the Xcode project
        env:
          APP_VARIANT: production
          IOS_BUILD_NUMBER: ${{ steps.version.outputs.app_build_version }}
        run: npx expo prebuild --platform ios ${{ inputs.clean_build && '--clean' || '' }} --no-install --non-interactive

      # Restored after prebuild because --clean deletes ios/ outright.
      # Podfile.lock is regenerated by prebuild, so it cannot be the cache key.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            packages/app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('package-lock.json', 'packages/app/app.config.js') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # Every run gets a fresh runner, so skipping --clean only pays off if the
      # compiled objects come back with it.
      - name: Cache Xcode DerivedData
        if: ${{ !inputs.clean_build }}
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('package-lock.json', 'packages/app/app.config.js') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      # RCT_USE_PREBUILT_RNCORE downloads React Native core as a prebuilt
      # XCFramework instead of compiling it from source, which is most of the
      # archive time.
      - name: Install CocoaPods dependencies
        working-directory: packages/app/ios
        env:
          RCT_USE_PREBUILT_RNCORE: "1"
        run: pod install

      - name: Build the signed .ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_REPO_URL: ${{ secrets.MATCH_REPO_URL }}
        run: bundle exec fastlane ios build_ipa

      # Uploading to TestFlight is a separate job, so a rejected upload retries
      # against this artifact instead of paying for an 18-minute rebuild.
      - name: Upload the build artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            packages/app/build/rambla.ipa
            packages/app/build/*.dSYM.zip
          if-no-files-found: warn
          retention-days: 14

  upload:
    needs: [build]
    if: ${{ inputs.upload_to_testflight }}
    # macos-15 ships Xcode 16.4 / iOS 18.5 SDK; App Store Connect rejects
    # uploads not built with the iOS 26 SDK or later.
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/app

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: packages/app
          bundler-cache: true

      - name: Download the build artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: ${{ runner.temp }}/ios-build

      - name: Decode the App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_KEY_P8_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/asc.p8"
          chmod 600 "$RUNNER_TEMP/asc.p8"
          echo "ASC_KEY_P8=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"

      # No match credentials here: uploading needs only the API key.
      - name: Upload to TestFlight
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: bundle exec fastlane ios upload_ipa ipa:"$RUNNER_TEMP/ios-build/rambla.ipa"

  submit-review:
    needs: [build, upload]
    if: ${{ inputs.submit_for_review }}
    # macos-15 ships Xcode 16.4 / iOS 18.5 SDK; App Store Connect rejects
    # uploads not built with the iOS 26 SDK or later.
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/app

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: packages/app
          bundler-cache: true

      - name: Decode the App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_KEY_P8_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/asc.p8"
          chmod 600 "$RUNNER_TEMP/asc.p8"
          echo "ASC_KEY_P8=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"

      - name: Submit for App Store review
        env:
          APP_BUILD_VERSION: ${{ needs.build.outputs.app_build_version }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: bundle exec fastlane ios submit_review
