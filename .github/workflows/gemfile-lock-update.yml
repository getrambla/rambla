name: Gemfile Lock Update

# The Gemfile pins a range (`fastlane "~> 2.234"`), so the lockfile is what
# decides which fastlane the iOS release builds with. Running on every push to
# main keeps it current without anyone remembering to; the commit is skipped
# when the resolve produces no change, which is almost every run.
#
# The [skip ci] below is load-bearing. This pushes with an app token, not
# GITHUB_TOKEN, and app-token pushes do retrigger workflows.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes in quick succession would otherwise both resolve and both try to
# push, and the loser fails non-fast-forward. Cancelling is free here: the run
# has no side effect until the commit at the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RAMBLA_BOT_APP_ID }}
          private-key: ${{ secrets.RAMBLA_BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: packages/app
          bundler-cache: false

      # --update, not a plain `bundle lock`: an existing lockfile already
      # satisfies the range, so a plain lock never moves off whatever version
      # resolved first. --add-platform takes a list; repeating the flag keeps
      # only the last value. The darwin entries are required because this
      # resolves on linux and the macOS runner installs from the result.
      - name: Refresh the gem lockfile
        working-directory: packages/app
        run: bundle lock --update --add-platform arm64-darwin x86_64-darwin

      - name: Commit the refreshed lockfile
        working-directory: packages/app
        run: |
          git diff --quiet Gemfile.lock && exit 0
          git config user.name "rambla-ai[bot]"
          git config user.email "266920839+rambla-ai[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git commit -m "chore: refresh packages/app/Gemfile.lock [skip ci]"
          git push
