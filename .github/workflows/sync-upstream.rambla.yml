name: Sync upstream

# Daily sync from getpaseo/paseo. fork/sync-upstream.sh rebrands each new
# upstream release tag onto the standing upstream-rebrand branch, then lands it
# in the branch this runs on through its own merge branch once ci.yml passes
# there, so brand strings never show up as a difference. Never rebases.

on:
  schedule:
    # 14:00 America/Denver (20:00 UTC); GitHub schedules are approximate.
    # Upstream is in Spain and cuts releases through its afternoon and evening,
    # so this fires around midnight there, after the day's releases have landed.
    - cron: "0 20 * * *"
  workflow_dispatch:

# Shared with gemfile-lock-update.yml so the two bots never race pushes.
concurrency:
  group: main-writer
  cancel-in-progress: false

permissions:
  contents: read
  # The script waits on ci.yml's run for each merge branch.
  actions: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  # ci.yml runs the same checks on each merge branch.
  LOCAL_SYNC: "0"

jobs:
  sync-upstream:
    name: sync upstream
    runs-on: ubuntu-latest
    steps:
      # The default token cannot push .github/workflows, and the rebrand branch
      # mirrors upstream's tree including its workflows.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RAMBLA_BOT_APP_ID }}
          private-key: ${{ secrets.RAMBLA_BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The sync lands in the branch this run was started on.
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # oxfmt comes from node_modules.
      - run: npm ci

      - name: Sync upstream
        env:
          # gh reads ci.yml's runs with this; git pushes with the app token checkout stored.
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "rambla-merge-bot"
          git config user.email "rambla-merge-bot@users.noreply.github.com"
          fork/sync-upstream.sh
