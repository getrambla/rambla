name: Deploy App

on:
  push:
    tags:
      - "v*"
      - "!v*-beta.*"
      - "app-v*"
      - "!app-v*-beta.*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # RAMBLA-FORK: fix: change deployment to rsync to server
    permissions:
      contents: read

    steps:
      # RAMBLA-FORK: fix: change deployment to rsync to server
      - name: Check deploy secrets
        env:
          DEPLOY_KEY: ${{ secrets.RAMBLA_APP_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.RAMBLA_APP_DEPLOY_KNOWN_HOSTS }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::RAMBLA_APP_DEPLOY_KEY is not set"; exit 1; }
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "::error::RAMBLA_APP_DEPLOY_KNOWN_HOSTS is not set"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Typecheck
        run: npm run typecheck --workspace=@getrambla/app

      # RAMBLA-FORK: fix: change deployment to rsync to server
      # RAMBLA-FORK: delete: - name: Build and deploy to Cloudflare Pages

      - name: Build web app
        run: npm run build:web --workspace=@getrambla/app

      # The server forces rrsync into the web app folder, so the destination path stays empty.
      - name: Deploy web app to server
        env:
          DEPLOY_KEY: ${{ secrets.RAMBLA_APP_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.RAMBLA_APP_DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlz --itemize-changes --stats --delete-delay --delay-updates packages/app/dist/ rambla-app@app.rambla.sh:
